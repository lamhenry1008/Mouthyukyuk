<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root{--blue:#1769e0;--red:#c5221f;--line:#dfe3e8;--muted:#667085}*{box-sizing:border-box}
    body{font:13px Arial,sans-serif;color:#202124;margin:0}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;z-index:5;display:flex;gap:8px;align-items:center}
    input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:7px;border:1px solid #c9ced6;border-radius:5px}textarea{min-height:75px}button{padding:7px 11px;border:1px solid #bcc3cc;border-radius:5px;background:#fff;cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .search{width:420px}.layout{display:grid;grid-template-columns:260px 1fr;height:695px}.results{border-right:1px solid var(--line);overflow:auto}.result{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#f5f8ff}.editor{padding:14px;overflow:auto}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.span2{grid-column:span 2}.span4{grid-column:span 4}label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field.invalid input,.field.invalid textarea,.field.invalid select{border:2px solid var(--red);background:#fff4f4}.error{color:var(--red);font-size:11px;margin-top:3px}
    h3{margin:18px 0 8px}.variant{
  display:grid;
  grid-template-columns:1.15fr .65fr .65fr .65fr .8fr .9fr 34px;
  gap:7px;
  padding:8px;
  background:#f8f9fa;
  margin-bottom:6px;
  border-radius:6px
}.image img{width:126px;height:126px;object-fit:contain;background:#f4f4f4}.image small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drop{border:2px dashed #b7c2d0;padding:18px;text-align:center;border-radius:7px}.busy{opacity:.55;pointer-events:none}.status{margin-left:auto;color:var(--muted)}
  </style>
</head>
<body>
  <div class="top">
    <input id="search" class="search" placeholder="Search title, handle, or exact SKU">
    <button onclick="search()">Search</button>
    <button onclick="newProduct()">New product</button>
    <button class="primary" onclick="save()">Save to Shopify + Sheet</button>
    <span id="status" class="status"></span>
  </div>

  <div class="layout">
    <div id="results" class="results"></div>
    <div id="editor" class="editor"></div>
  </div>

  <script>
    const initialMode = '<?= mode ?>';
    let model = null;
    let errors = {};

    const esc = s => String(s ?? '').replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[c])
    );

    function call(name, ...args) {
      return new Promise((resolve, reject) =>
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[name](...args)
      );
    }

    function setBusy(on, text = '') {
      document.body.classList.toggle('busy', on);
      document.getElementById('status').textContent = text;
    }

    async function search() {
      const q = document.getElementById('search').value.trim();

      if (!q) return;

      setBusy(true, 'Searching…');

      try {
        const rows = await call('searchShopifyCatalog', q);

        document.getElementById('results').innerHTML =
          rows.map(p => `
            <div class="result" onclick="openProduct('${p.id}')">
              <b>${esc(p.title)}</b><br>
              <small>
                ${esc(p.handle)} ·
                ${esc((p.variants || []).map(v => v.sku).join(', '))}
              </small>
            </div>
          `).join('') || '<div class="result">No matches</div>';
      } catch (e) {
        alert(e.message || e);
      } finally {
        setBusy(false);
      }
    }

    async function openProduct(id) {
      setBusy(true, 'Loading…');

      try {
        model = await call('loadShopifyProduct', id);
        errors = {};
        render();
      } catch (e) {
        alert(e.message || e);
      } finally {
        setBusy(false);
      }
    }

    async function newProduct() {
      model = await call('blankEditorModel');
      errors = {};
      render();
    }

    function field(key, label, value, span = 1, type = 'text') {
      const err = errors[key];

      return `
        <div class="field span${span} ${err ? 'invalid' : ''}">
          <label>${label}</label>
          ${
            type === 'textarea'
              ? `<textarea data-key="${key}">${esc(value)}</textarea>`
              : `<input data-key="${key}" value="${esc(value)}">`
          }
          ${err ? `<div class="error">${esc(err)}</div>` : ''}
        </div>
      `;
    }

    function render() {
      if (!model) return;

      model.collection = (model.title || '').includes(' - ')
        ? model.title.split(' - ')[0].trim()
        : (model.title || '');

      document.getElementById('editor').innerHTML = `
        <div class="grid">
          ${field('title', 'English Name *', model.title, 2)}
          ${field('handle', 'Handle *', model.handle || '', 1)}
          ${field('status', 'Status', model.status || 'DRAFT', 1)}
          ${field('vendor', 'Brand *', model.vendor, 1)}
          ${field(
            'collection',
            'Drive collection (derived)',
            model.collection,
            2
          )}
          ${field(
            'productType',
            'Product Type *',
            model.productType,
            1
          )}
          ${field(
            'tags',
            'Tags',
            Array.isArray(model.tags)
              ? model.tags.join(', ')
              : model.tags,
            2
          )}
          ${field(
            'targetSheetName',
            'New-row target sheet',
            model.targetSheetName || '',
            2
          )}
          ${field(
            'descriptionHtml',
            'Description HTML',
            model.descriptionHtml,
            4,
            'textarea'
          )}
        </div>

        <h3>Variants</h3>

        <div id="variants">
          ${(model.variants || []).map(variantHtml).join('')}
        </div>

        <button onclick="addVariant()">+ Add variant</button>

        ${
          errors.variants
            ? `<div class="error">${esc(errors.variants)}</div>`
            : ''
        }

        <h3>Images *</h3>

        <div class="drop ${errors.images ? 'field invalid' : ''}">
          <input
            id="files"
            type="file"
            accept="image/*"
            multiple
            onchange="uploadFiles(this.files)"
          >

          <div>
            Images are resized to max 2048 px and saved as JPEG.
          </div>

          ${
            errors.images
              ? `<div class="error">${esc(errors.images)}</div>`
              : ''
          }
        </div>

        <div class="images">
          ${
            [
              ...(model.driveImages || []),
              ...(model.images || []),
            ].map(imageHtml).join('')
          }
        </div>

        <h3>Sheet links</h3>

        <div>
          ${
            (model.sourceRows || [])
              .map(r => `${esc(r.sheetName)} row ${r.row}`)
              .join('<br>') ||
            'No matching source row; saving will append one.'
          }
        </div>
      `;

      bindFields();
    }

    function variantHtml(v, i) {
      return `
        <div class="variant">
          <div class="field ${
            errors[`variant_${i}_sku`] ? 'invalid' : ''
          }">
            <label>SKU *</label>
            <input
              data-v="${i}"
              data-vkey="sku"
              value="${esc(v.sku)}"
            >
            ${
              errors[`variant_${i}_sku`]
                ? '<div class="error">Required</div>'
                : ''
            }
          </div>

          <div class="field ${
            errors[`variant_${i}_price`] ? 'invalid' : ''
          }">
            <label>Price *</label>
            <input
              data-v="${i}"
              data-vkey="price"
              value="${esc(v.price)}"
            >
          </div>

          <div class="field ${
            errors[`variant_${i}_inventory`]
              ? 'invalid'
              : ''
          }">
            <label>Inventory *</label>

            <input
              type="number"
              min="0"
              step="1"
              data-v="${i}"
              data-vkey="inventory"
              value="${esc(
                v.inventory == null
                  ? ''
                  : v.inventory
              )}"
            >

            ${
              errors[`variant_${i}_inventory`]
                ? `<div class="error">${
                    esc(errors[`variant_${i}_inventory`])
                  }</div>`
                : ''
            }
          </div>

          <div>
            <label>Compare at</label>
            <input
              data-v="${i}"
              data-vkey="compareAtPrice"
              value="${esc(v.compareAtPrice)}"
            >
          </div>

          <div>
            <label>Barcode</label>
            <input
              data-v="${i}"
              data-vkey="barcode"
              value="${esc(v.barcode)}"
            >
          </div>

          <div>
            <label>Options (Name=Value)</label>
            <input
              data-v="${i}"
              data-vkey="optionsText"
              value="${
                esc(
                  (v.optionValues || [])
                    .map(x => x.optionName + '=' + x.name)
                    .join('; ')
                )
              }"
            >
          </div>

          <button onclick="removeVariant(${i})">×</button>
        </div>
      `;
    }

    function imageHtml(img) {
      return `
        <div class="image">
          <img src="${esc(img.downloadUrl || img.url)}">

          <small>
            ${esc(img.name || img.alt || 'Shopify image')}
          </small>

          ${
            img.source === 'DRIVE'
              ? `
                <button onclick="removeImage('${img.id}')">
                  Remove Drive file
                </button>
              `
              : '<small>Shopify media</small>'
          }
        </div>
      `;
    }

    function bindFields() {
      document.querySelectorAll('[data-key]').forEach(el => {
        el.oninput = () => {
          model[el.dataset.key] = el.value;

          if (el.dataset.key === 'title') {
            model.collection = el.value.includes(' - ')
              ? el.value.split(' - ')[0].trim()
              : el.value;
          }
        };
      });

      document.querySelectorAll('[data-v]').forEach(el => {
        el.oninput = () => {
          const v = model.variants[Number(el.dataset.v)];

          if (el.dataset.vkey === 'optionsText') {
            v.optionValues = el.value
              .split(';')
              .map(x => x.split('='))
              .filter(x => x.length === 2)
              .map(x => ({
                optionName: x[0].trim(),
                name: x[1].trim(),
              }));
          } else {
            v[el.dataset.vkey] = el.value;
          }
        };
      });
    }

    function addVariant() {
      model.variants.push({
        id: '',
        sku: '',
        price: '',
        compareAtPrice: '',
        barcode: '',
        inventory: '',
        inventoryItemId: '',
        tracked: true,
        optionValues: [],
      });

      render();
    }

    function removeVariant(i) {
      model.variants.splice(i, 1);
      render();
    }

    async function resize(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = reject;

        reader.onload = () => {
          const img = new Image();

          img.onerror = reject;

          img.onload = () => {
            const scale = Math.min(
              1,
              2048 / Math.max(img.width, img.height)
            );

            const canvas = document.createElement('canvas');

            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);

            canvas
              .getContext('2d')
              .drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );

            resolve(
              canvas
                .toDataURL('image/jpeg', 0.9)
                .split(',')[1]
            );
          };

          img.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    }

    async function uploadFiles(files) {
      if (!model) {
        return;
      }

      if (!files || files.length === 0) {
        return;
      }

      setBusy(true, 'Uploading images…');

      try {
        for (const file of files) {
          const base64 = await resize(file);

          const result = await call(
            'uploadEditorImage',
            {
              base64,
              brand: model.vendor,
              title: model.title,
              collection: model.collection,
            }
          );

          /*
          * Remember every image uploaded during this popup session.
          *
          * Images loaded earlier from Drive are displayed but are not marked
          * pending, so they won't be uploaded to Shopify again.
          */
          const pendingIds = new Set(
            (model.driveImages || [])
              .filter((image) => {
                return image.pendingUpload === true;
              })
              .map((image) => {
                return image.id;
              })
          );

          // Add the image that was just uploaded.
          if (result.image && result.image.id) {
            pendingIds.add(result.image.id);
          }

          /*
          * result.all contains only Drive images matching the exact product
          * name, as filtered by uploadEditorImage().
          *
          * Restore pendingUpload=true for all images uploaded during this
          * current editor session.
          */
          model.driveImages = (result.all || []).map((image) => {
            return Object.assign({}, image, {
              pendingUpload: pendingIds.has(image.id),
            });
          });
        }

        delete errors.images;
        render();
      } catch (error) {
        alert(
          error && error.message
            ? error.message
            : String(error)
        );
      } finally {
        setBusy(false);

        /*
        * Clear the file input so selecting the same filename again will still
        * trigger onchange.
        */
        const fileInput =
          document.getElementById('files');

        if (fileInput) {
          fileInput.value = '';
        }
      }
    }

    async function removeImage(id) {
      if (!confirm('Move this Drive image to trash?')) return;

      setBusy(true, 'Removing…');

      try {
        await call('removeDriveImage', id);

        model.driveImages = model.driveImages.filter(
          image => image.id !== id
        );

        render();
      } catch (e) {
        alert(e.message || e);
      } finally {
        setBusy(false);
      }
    }

    async function save() {
      if (!model) return;

      setBusy(true, 'Saving…');

      try {
        const result = await call(
          'saveCatalogProduct',
          model
        );

        if (!result.ok) {
          errors = result.errors || {};
          render();

          document.getElementById('status').textContent =
            'Complete highlighted fields';

          return;
        }

        model = result.product;
        errors = {};

        render();

        alert(
          `Saved. Sheet rows: ${result.written.join(', ')}`
        );
      } catch (e) {
        alert(e.message || e);
      } finally {
        setBusy(false);
      }
    }

    if (initialMode === 'new') {
      newProduct();
    }
  </script>
</body>
</html>
