



<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --blue: #1769e0;
      --red: #c5221f;
      --line: #dfe3e8;
      --muted: #667085;
      --surface: #f8f9fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #202124;
      font: 13px Arial, sans-serif;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 7px;
      border: 1px solid #c9ced6;
      border-radius: 5px;
      background: #fff;
    }

    input[readonly] {
      color: var(--muted);
      background: #f2f4f7;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      padding: 7px 11px;
      border: 1px solid #bcc3cc;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    button.danger {
      color: var(--red);
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .search {
      width: 380px;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      height: 695px;
    }

    .results {
      overflow: auto;
      border-right: 1px solid var(--line);
    }

    .result {
      padding: 9px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .result:hover {
      background: #f5f8ff;
    }

    .editor {
      overflow: auto;
      padding: 12px;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .span2 {
      grid-column: span 2;
    }

    .span3 {
      grid-column: span 3;
    }

    .span4 {
      grid-column: span 4;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .field.invalid input,
    .field.invalid textarea,
    .field.invalid select,
    .field.invalid details {
      border: 2px solid var(--red);
      background: #fff4f4;
    }

    .error {
      margin-top: 3px;
      color: var(--red);
      font-size: 11px;
    }

    .help {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    h3 {
      margin: 16px 0 7px;
    }

    .multi {
      position: relative;
      border: 1px solid #c9ced6;
      border-radius: 5px;
      background: #fff;
    }

    .multi summary {
      min-height: 33px;
      padding: 8px;
      list-style: none;
      cursor: pointer;
    }

    .multi summary::-webkit-details-marker {
      display: none;
    }

    .multi summary::after {
      float: right;
      content: "▾";
      color: var(--muted);
    }

    .choices {
      position: absolute;
      z-index: 10;
      top: calc(100% + 3px);
      left: -1px;
      width: max(100%, 240px);
      max-height: 240px;
      overflow: auto;
      padding: 7px;
      border: 1px solid #b8c0ca;
      border-radius: 5px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
    }

    .choice {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 4px;
      color: #202124;
      font-size: 12px;
    }

    .choice input {
      width: auto;
      margin: 0;
    }

    .custom-choice {
      margin-top: 6px;
      border-top: 1px solid var(--line);
      padding-top: 7px;
    }

    .variant {
      display: grid;
      grid-template-columns:
        minmax(105px, 1.15fr)
        minmax(72px, 0.65fr)
        minmax(78px, 0.65fr)
        minmax(82px, 0.65fr)
        minmax(90px, 0.8fr)
        minmax(120px, 1fr)
        112px
        34px;
      gap: 6px;
      align-items: end;
      margin-bottom: 6px;
      padding: 8px;
      border-radius: 6px;
      background: var(--surface);
    }

    .checkbox-field {
      align-self: center;
      padding-top: 15px;
    }

    .checkbox-label {
      display: flex;
      gap: 6px;
      align-items: center;
      color: #202124;
      font-size: 11px;
    }

    .checkbox-label input {
      width: auto;
      margin: 0;
    }

    .drop {
      padding: 15px;
      border: 2px dashed #b7c2d0;
      border-radius: 7px;
      text-align: center;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .image {
      min-width: 0;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .image img {
      width: 100%;
      height: 124px;
      object-fit: contain;
      background: #f4f4f4;
    }

    .image small {
      display: block;
      overflow: hidden;
      margin: 4px 0;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .image button {
      width: 100%;
      padding: 5px;
    }

    .image-removal-notice {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid #f1c36d;
      border-radius: 5px;
      color: #714b00;
      background: #fff8e8;
    }

    .busy {
      pointer-events: none;
      opacity: 0.55;
    }

    .status {
      margin-left: auto;
      color: var(--muted);
    }

    .mto-bulk-view[hidden] {
      display: none;
    }

    .mto-bulk-view {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #fff;
    }

    .mto-bulk-view.saving {
      cursor: wait;
    }

    .mto-bulk-view.saving .mto-bulk-header,
    .mto-bulk-view.saving .mto-bulk-actions,
    .mto-bulk-view.saving .mto-bulk-table-wrap,
    .mto-bulk-view.saving .mto-bulk-footer {
      pointer-events: none;
    }

    .mto-bulk-header,
    .mto-bulk-actions,
    .mto-bulk-footer {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
      align-items: end;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .mto-bulk-header {
      align-items: center;
    }

    .mto-bulk-header h2 {
      flex: 0 0 auto;
      margin: 0 8px 0 0;
      font-size: 17px;
    }

    .mto-bulk-source {
      width: 185px;
    }

    .mto-bulk-filter {
      width: min(340px, 32vw);
    }

    .mto-bulk-actions {
      background: var(--surface);
    }

    .mto-bulk-action-field {
      min-width: 160px;
    }

    .mto-bulk-action-field label {
      margin-bottom: 3px;
    }

    .mto-bulk-selection {
      align-self: center;
      min-width: 115px;
      color: var(--muted);
    }

    .mto-bulk-message {
      align-self: center;
      margin-left: auto;
      color: var(--muted);
    }

    .mto-bulk-message.error {
      color: var(--red);
    }

    .mto-bulk-message.success {
      color: #137333;
    }

    .mto-bulk-table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      background: #fff;
    }

    .mto-bulk-table {
      width: 100%;
      min-width: 1530px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 12px;
    }

    .mto-bulk-table th,
    .mto-bulk-table td {
      padding: 5px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      background: #fff;
    }

    .mto-bulk-table th {
      position: sticky;
      z-index: 2;
      top: 0;
      color: #3c4043;
      background: #eef2f6;
      text-align: left;
    }

    .mto-bulk-table th:first-child,
    .mto-bulk-table td:first-child {
      position: sticky;
      z-index: 1;
      left: 0;
      text-align: center;
    }

    .mto-bulk-table th:first-child {
      z-index: 3;
      background: #eef2f6;
    }

    .mto-bulk-table input[type="checkbox"] {
      width: auto;
      margin-top: 7px;
    }

    .mto-bulk-table input {
      min-width: 0;
      padding: 6px;
    }

    .mto-bulk-table tr.saved td {
      background: #f0f8f1;
    }

    .mto-bulk-table tr.saved td:first-child {
      background: #f0f8f1;
    }

    .mto-image-cell {
      text-align: center;
    }

    .mto-image-cell img {
      display: block;
      width: 58px;
      height: 58px;
      margin: 0 auto;
      border-radius: 4px;
      object-fit: contain;
      background: #f3f4f6;
    }

    .mto-image-cell input {
      margin-top: 5px;
      padding: 4px;
      font-size: 10px;
    }

    .mto-image-missing {
      display: flex;
      width: 58px;
      height: 58px;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 1px dashed #d69e2e;
      border-radius: 4px;
      color: #8a5a00;
      background: #fff8e1;
      font-size: 10px;
      line-height: 1.2;
    }

    .mto-source-row {
      padding-top: 8px;
      text-align: center;
      white-space: nowrap;
    }

    .mto-invalid-cell input {
      border: 2px solid var(--red);
      background: #fff4f4;
    }

    .mto-warning-cell {
      background: #fff8e1 !important;
    }

    .mto-row-status {
      font-size: 11px;
      line-height: 1.35;
    }

    .mto-row-status.ready {
      color: #137333;
    }

    .mto-row-status.blocked {
      color: var(--red);
    }

    .mto-row-status.warning {
      color: #8a5a00;
    }

    .mto-bulk-empty {
      padding: 45px 20px;
      color: var(--muted);
      text-align: center;
    }

    .mto-bulk-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="top">
    <input
      id="search"
      class="search"
      placeholder="Search title, handle, or exact SKU"
    >
    <button onclick="search()">Search</button>
    <button onclick="newProduct()">New product</button>
    <button onclick="openMtoBulkEditor()">Bulk to MTO</button>
    <button onclick="openCheckout()">Checkout</button>
    <button class="primary" onclick="save()">Save to Shopify + Sheet</button>
    <span id="status" class="status"></span>
  </div>

  <div class="layout">
    <div id="results" class="results"></div>
    <div id="editor" class="editor">
      <div class="empty">Search for a product or create a new one.</div>
    </div>
  </div>

  <section id="mto-bulk-view" class="mto-bulk-view" hidden>
    <div class="mto-bulk-header">
      <h2>Bulk copy to MTO 32</h2>
      <div class="mto-bulk-source">
        <label for="mto-bulk-source">Product sheet</label>
        <select id="mto-bulk-source"></select>
      </div>
      <button onclick="loadMtoBulkSourceRows()">Load sheet</button>
      <div class="mto-bulk-filter">
        <label for="mto-bulk-filter">Filter loaded products</label>
        <input
          id="mto-bulk-filter"
          placeholder="ID, English/Chinese name, option, or source row"
          oninput="filterMtoBulkRows(this.value)"
        >
      </div>
      <span id="mto-bulk-load-summary" class="mto-bulk-message"></span>
      <button onclick="closeMtoBulkEditor()">Close</button>
    </div>

    <div class="mto-bulk-actions">
      <button onclick="selectAllVisibleMtoRows()">Select all visible</button>
      <button onclick="clearMtoBulkSelection()">Clear selection</button>
      <span id="mto-bulk-selected" class="mto-bulk-selection">0 selected</span>
      <div class="mto-bulk-action-field">
        <label for="mto-bulk-location">Location for selected</label>
        <input
          id="mto-bulk-location"
          list="mto-location-options"
          placeholder="Choose from..."
        >
      </div>
      <button onclick="applyMtoLocationToSelected()">
        Apply location
      </button>
      <span id="mto-bulk-validation" class="mto-bulk-message"></span>
    </div>

    <div class="mto-bulk-table-wrap">
      <table class="mto-bulk-table">
        <colgroup>
          <col style="width: 42px">
          <col style="width: 185px">
          <col style="width: 76px">
          <col style="width: 145px">
          <col style="width: 190px">
          <col style="width: 165px">
          <col style="width: 155px">
          <col style="width: 88px">
          <col style="width: 130px">
          <col style="width: 82px">
          <col style="width: 210px">
        </colgroup>
        <thead>
          <tr>
            <th>Select</th>
            <th>Image</th>
            <th>Source row</th>
            <th>MTO Item ID *</th>
            <th>English Name *</th>
            <th>Chinese Name *</th>
            <th>Option</th>
            <th>Price *</th>
            <th>Location *</th>
            <th>Stock *</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="mto-bulk-rows"></tbody>
      </table>
      <div id="mto-bulk-empty" class="mto-bulk-empty">
        Choose a source product sheet to begin.
      </div>
    </div>

    <datalist id="mto-location-options"></datalist>

    <div class="mto-bulk-footer">
      <span id="mto-bulk-save-status" class="mto-bulk-message"></span>
      <button onclick="closeMtoBulkEditor()">Cancel</button>
      <button
        id="mto-bulk-save"
        class="primary"
        onclick="saveMtoBulkSelection()"
        disabled
      >
        Copy selected to MTO 32 Summary
      </button>
    </div>
  </section>

  <script>
    const initialMode = '<?= mode ?>';
    let model = null;
    let errors = {};
    let editorOptions = null;
    const mtoBulk = {
      bootstrap: null,
      sourceSheetName: '',
      sourceSheetId: '',
      rows: [],
      filter: '',
      locations: ['大篋', '細篋'],
      existingItemIds: new Set(),
      dirty: false,
      loading: false,
      saving: false,
    };

    const esc = (value) => String(value ?? '').replace(
      /[&<>"']/g,
      (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[character])
    );

    function call(name, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[name](...args);
      });
    }

    function setBusy(on, text = '') {
      document.body.classList.toggle('busy', on);
      document.getElementById('status').textContent = text;
    }

    async function ensureEditorOptions() {
      if (!editorOptions) {
        editorOptions = await call('getEditorOptions');
      }

      return editorOptions;
    }

    const clientClean = (value) => String(value ?? '').trim();

    function isMtoLocationPlaceholder(value) {
      return clientClean(value).toLowerCase() === 'choose from...';
    }

    function normalizeMtoItemId(value) {
      return clientClean(value).toUpperCase();
    }

    function uniqueMtoValues(values) {
      const seen = new Set();

      return (values || []).map(clientClean).filter((value) => {
        const key = value.toUpperCase();

        if (!key || seen.has(key)) {
          return false;
        }

        seen.add(key);
        return true;
      });
    }

    function mtoBulkMaxRows() {
      const configured = Number(
        mtoBulk.bootstrap && mtoBulk.bootstrap.maxRows
      );

      return Number.isInteger(configured) && configured > 0
        ? configured
        : 500;
    }

    function mtoBulkSourceSheets(bootstrap) {
      const source = bootstrap && (
        bootstrap.sourceSheets ||
        bootstrap.sheetNames ||
        bootstrap.sheets
      ) || [];

      return source.map((sheet) => {
        if (typeof sheet === 'string') {
          return {name: sheet, label: sheet};
        }

        const name = clientClean(
          sheet && (sheet.name || sheet.sheetName || sheet.value)
        );

        return {
          name,
          label: clientClean(sheet && (sheet.label || sheet.name)) || name,
        };
      }).filter((sheet) => sheet.name);
    }

    function mtoBulkImageText(value) {
      if (Array.isArray(value)) {
        return value.map(clientClean).filter(Boolean).join('\n');
      }

      return clientClean(value);
    }

    function firstMtoBulkImage(value) {
      const first = mtoBulkImageText(value)
        .split(/[\r\n;|]+/)
        .map(clientClean)
        .find(Boolean) || '';

      return /^https?:\/\/[^\s]+$/i.test(first) ? first : '';
    }

    function looksLikeMtoBulkFormula(value) {
      return /^[=+\-@]/.test(clientClean(value));
    }

    function normalizeMtoBulkRow(source, index) {
      source = source || {};

      const itemId = clientClean(
        source.itemId ||
        source.mtoItemId ||
        source.sourceItemId ||
        source.id
      );
      const existingAtLoad = Boolean(
        source.existsInMto ||
        source.existingInMto ||
        source.alreadyExists ||
        source.isExisting
      );
      const sourceErrors = Array.isArray(source.errors)
        ? source.errors.map(clientClean).filter(Boolean)
        : (
          clientClean(source.error || source.blockedReason)
            ? [clientClean(source.error || source.blockedReason)]
            : []
        );

      return {
        clientIndex: index,
        sourceSheetName: clientClean(
          source.sourceSheetName ||
          source.sheetName ||
          mtoBulk.sourceSheetName
        ),
        sourceRow: Number(
          source.sourceRow || source.rowNumber || source.row || 0
        ),
        sourceSheetId: clientClean(
          source.sourceSheetId || source.sheetId || mtoBulk.sourceSheetId
        ),
        sourceFingerprint: clientClean(
          source.sourceFingerprint || source.fingerprint
        ),
        itemId,
        originalItemId: itemId,
        englishName: clientClean(
          source.englishName || source.title || source.productTitle
        ),
        chineseName: clientClean(
          source.chineseName || source.titleChinese
        ),
        option: clientClean(
          source.option || source.itemOption || source.variantTitle
        ),
        price: source.price == null ? '' : clientClean(source.price),
        location: clientClean(
          source.location || source.itemLocation || source.sourceLocation
        ),
        stock: source.stock == null || clientClean(source.stock) === ''
          ? String(
            Number(
              mtoBulk.bootstrap && mtoBulk.bootstrap.defaultStock
            ) || 0
          )
          : clientClean(source.stock),
        imageUrl: mtoBulkImageText(
          source.imageUrl || source.imageUrls || source.images
        ),
        selected: source.selected === true,
        saved: false,
        dirty: false,
        existingAtLoad,
        serverErrors: sourceErrors,
      };
    }

    function setMtoBulkMessage(elementId, message, tone = '') {
      const element = document.getElementById(elementId);

      if (!element) {
        return;
      }

      element.textContent = message || '';
      element.classList.remove('error', 'success');

      if (tone) {
        element.classList.add(tone);
      }
    }

    function renderMtoBulkLocations() {
      const datalist = document.getElementById('mto-location-options');

      if (!datalist) {
        return;
      }

      mtoBulk.locations = uniqueMtoValues([
        '大篋',
        '細篋',
        ...mtoBulk.locations,
      ]).filter((location) => !isMtoLocationPlaceholder(location));

      datalist.innerHTML = mtoBulk.locations.map((location) => {
        return `<option value="${esc(location)}"></option>`;
      }).join('');
    }

    function collectMtoBulkExistingIds(source) {
      const values = source && (
        source.existingItemIds ||
        source.existingIds ||
        source.mtoItemIds
      ) || [];

      (values || []).forEach((value) => {
        const key = normalizeMtoItemId(value);

        if (key) {
          mtoBulk.existingItemIds.add(key);
        }
      });
    }

    function renderMtoBulkBootstrap() {
      const sourceSelect = document.getElementById('mto-bulk-source');
      const sheets = mtoBulkSourceSheets(mtoBulk.bootstrap);

      sourceSelect.innerHTML = sheets.map((sheet) => {
        return `<option value="${esc(sheet.name)}">${esc(sheet.label)}</option>`;
      }).join('');

      const preferred = clientClean(
        mtoBulk.bootstrap && (
          mtoBulk.bootstrap.defaultSourceSheetName ||
          mtoBulk.bootstrap.activeSheetName ||
          mtoBulk.bootstrap.sourceSheetName
        )
      );

      if (preferred && sheets.some((sheet) => sheet.name === preferred)) {
        sourceSelect.value = preferred;
      }

      mtoBulk.locations = uniqueMtoValues([
        ...mtoBulk.locations,
        ...(
          mtoBulk.bootstrap && (
            mtoBulk.bootstrap.locations ||
            mtoBulk.bootstrap.locationOptions
          ) || []
        ),
      ]);
      collectMtoBulkExistingIds(mtoBulk.bootstrap);
      renderMtoBulkLocations();
    }

    async function openMtoBulkEditor() {
      const view = document.getElementById('mto-bulk-view');
      view.hidden = false;
      document.getElementById('mto-bulk-location').value = '';
      mtoBulk.loading = true;
      setMtoBulkMessage(
        'mto-bulk-load-summary',
        'Loading source sheets…'
      );

      try {
        mtoBulk.bootstrap = await call('getMtoBulkEditorBootstrap');
        mtoBulk.existingItemIds = new Set();
        renderMtoBulkBootstrap();

        const sourceSelect = document.getElementById('mto-bulk-source');

        if (!sourceSelect.options.length) {
          throw new Error(
            'No product sheets are available. Add a sheet such as 墨水 first.'
          );
        }

        await loadMtoBulkSourceRows(true);
      } catch (error) {
        setMtoBulkMessage(
          'mto-bulk-load-summary',
          error.message || String(error),
          'error'
        );
      } finally {
        mtoBulk.loading = false;
        refreshMtoBulkSummary();
      }
    }

    function closeMtoBulkEditor() {
      if (mtoBulk.saving) {
        return;
      }

      const hasChanges = mtoBulk.dirty ||
        mtoBulk.rows.some((row) => row.selected && !row.saved);

      if (
        hasChanges &&
        !confirm('Close the bulk editor and discard unsaved selections?')
      ) {
        return;
      }

      if (initialMode === 'mto-bulk') {
        google.script.host.close();
        return;
      }

      document.getElementById('mto-bulk-view').hidden = true;
    }

    async function loadMtoBulkSourceRows(skipDiscardPrompt = false) {
      if (
        mtoBulk.saving ||
        (mtoBulk.loading && !skipDiscardPrompt)
      ) {
        return;
      }

      const sourceSelect = document.getElementById('mto-bulk-source');
      const sheetName = clientClean(sourceSelect.value);

      if (!sheetName) {
        return;
      }

      if (
        !skipDiscardPrompt &&
        (mtoBulk.dirty || mtoBulk.rows.some((row) => row.selected)) &&
        !confirm('Load another sheet and discard the current bulk edits?')
      ) {
        return;
      }

      mtoBulk.loading = true;
      mtoBulk.sourceSheetName = sheetName;
      mtoBulk.sourceSheetId = '';
      setMtoBulkMessage(
        'mto-bulk-load-summary',
        `Loading ${sheetName}…`
      );
      refreshMtoBulkSummary();

      try {
        const response = await call('getMtoBulkSourceRows', sheetName);
        const rawRows = Array.isArray(response)
          ? response
          : (
            response && (
              response.rows || response.items || response.products
            ) || []
          );

        mtoBulk.sourceSheetId = clientClean(
          response && (response.sourceSheetId || response.sheetId)
        );
        collectMtoBulkExistingIds(response);

        if (response && (response.locations || response.locationOptions)) {
          mtoBulk.locations = uniqueMtoValues([
            ...mtoBulk.locations,
            ...(response.locations || response.locationOptions),
          ]);
          renderMtoBulkLocations();
        }

        mtoBulk.rows = rawRows.map(normalizeMtoBulkRow);
        mtoBulk.filter = '';
        mtoBulk.dirty = false;
        document.getElementById('mto-bulk-filter').value = '';
        renderMtoBulkRows();
        setMtoBulkMessage(
          'mto-bulk-load-summary',
          `${mtoBulk.rows.length} row(s) loaded from ${sheetName}.`
        );
      } catch (error) {
        mtoBulk.rows = [];
        renderMtoBulkRows();
        setMtoBulkMessage(
          'mto-bulk-load-summary',
          error.message || String(error),
          'error'
        );
      } finally {
        mtoBulk.loading = false;
        refreshMtoBulkSummary();
      }
    }

    function mtoBulkSelectedIdCounts() {
      const counts = new Map();

      mtoBulk.rows.forEach((row) => {
        if (!row.selected || row.saved) {
          return;
        }

        const key = normalizeMtoItemId(row.itemId);

        if (key) {
          counts.set(key, (counts.get(key) || 0) + 1);
        }
      });

      return counts;
    }

    function isExistingMtoBulkRow(row) {
      const itemIdKey = normalizeMtoItemId(row && row.itemId);

      if (!itemIdKey) {
        return false;
      }

      return Boolean(
        mtoBulk.existingItemIds.has(itemIdKey) ||
        (
          row.existingAtLoad &&
          itemIdKey === normalizeMtoItemId(row.originalItemId)
        )
      );
    }

    function validateMtoBulkRow(row, idCounts) {
      const errorsByField = {};
      const errors = [];
      const warnings = [];
      const addError = (field, message) => {
        errorsByField[field] = true;
        errors.push(message);
      };
      const itemIdKey = normalizeMtoItemId(row.itemId);

      if (!clientClean(row.sourceFingerprint)) {
        errors.push('Source row fingerprint is missing; reload this sheet.');
      }

      if (!itemIdKey) {
        addError('itemId', 'MTO Item ID is required.');
      } else {
        if (isExistingMtoBulkRow(row)) {
          addError('itemId', 'This MTO Item ID already exists.');
        }

        if (row.selected && (idCounts.get(itemIdKey) || 0) > 1) {
          addError('itemId', 'Duplicate MTO Item ID in this selection.');
        }
      }

      if (!clientClean(row.englishName)) {
        addError('englishName', 'English Name is required.');
      }

      if (!clientClean(row.chineseName)) {
        addError('chineseName', 'Chinese Name is required.');
      }

      [
        ['itemId', 'MTO Item ID', row.itemId],
        ['englishName', 'English Name', row.englishName],
        ['chineseName', 'Chinese Name', row.chineseName],
        ['option', 'Option', row.option],
        ['location', 'Location', row.location],
      ].forEach((entry) => {
        if (looksLikeMtoBulkFormula(entry[2])) {
          addError(
            entry[0],
            `${entry[1]} cannot begin with =, +, -, or @.`
          );
        }
      });

      if (
        clientClean(row.price) === '' ||
        !Number.isFinite(Number(row.price)) ||
        Number(row.price) < 0
      ) {
        addError('price', 'Price must be zero or a positive number.');
      }

      if (
        !clientClean(row.location) ||
        isMtoLocationPlaceholder(row.location)
      ) {
        addError('location', 'Choose or enter a location.');
      }

      if (
        clientClean(row.stock) === '' ||
        !Number.isInteger(Number(row.stock)) ||
        Number(row.stock) < 0
      ) {
        addError('stock', 'Stock must be a non-negative whole number.');
      }

      (row.serverErrors || []).forEach((message) => {
        if (message) {
          errors.push(message);
        }
      });

      if (!firstMtoBulkImage(row.imageUrl)) {
        warnings.push('Missing image URL.');
      }

      return {errorsByField, errors, warnings};
    }

    function mtoBulkRowStatusHtml(row, validation) {
      if (row.saved) {
        return '<span class="mto-row-status ready">Copied to MTO 32</span>';
      }

      if (validation.errors.length) {
        return `
          <span class="mto-row-status blocked">
            ${validation.errors.map(esc).join('<br>')}
          </span>
        `;
      }

      if (validation.warnings.length) {
        return `
          <span class="mto-row-status warning">
            Ready with warning:<br>${validation.warnings.map(esc).join('<br>')}
          </span>
        `;
      }

      return '<span class="mto-row-status ready">Ready</span>';
    }

    function mtoBulkMatchesFilter(row, index) {
      const term = clientClean(mtoBulk.filter).toLowerCase();

      if (!term) {
        return true;
      }

      const text = [
        row.sourceRow,
        row.itemId,
        row.englishName,
        row.chineseName,
        row.option,
        row.location,
        row.saved ? 'copied saved' : '',
        index + 1,
      ].join(' ').toLowerCase();

      return text.includes(term);
    }

    function renderMtoBulkRows() {
      const tbody = document.getElementById('mto-bulk-rows');
      const empty = document.getElementById('mto-bulk-empty');
      const idCounts = mtoBulkSelectedIdCounts();
      const visible = mtoBulk.rows
        .map((row, index) => ({row, index}))
        .filter(({row, index}) => mtoBulkMatchesFilter(row, index));

      tbody.innerHTML = visible.map(({row, index}) => {
        const validation = validateMtoBulkRow(row, idCounts);
        const cellClass = (field) => {
          return validation.errorsByField[field]
            ? 'mto-invalid-cell'
            : '';
        };
        const imageUrl = firstMtoBulkImage(row.imageUrl);

        return `
          <tr id="mto-bulk-row-${index}" class="${row.saved ? 'saved' : ''}">
            <td>
              <input
                type="checkbox"
                aria-label="Select source row ${esc(row.sourceRow || index + 2)}"
                ${row.selected ? 'checked' : ''}
                ${
                  mtoBulk.saving ||
                  row.saved ||
                  (isExistingMtoBulkRow(row) && !row.selected)
                    ? 'disabled'
                    : ''
                }
                onchange="toggleMtoBulkRow(${index}, this.checked)"
              >
            </td>
            <td class="mto-image-cell ${imageUrl ? '' : 'mto-warning-cell'}">
              <div>
                ${
                  imageUrl
                    ? `<img src="${esc(imageUrl)}" alt="${esc(row.englishName)}">`
                    : '<div class="mto-image-missing">Missing<br>image</div>'
                }
              </div>
              <input
                type="url"
                placeholder="Image URL (optional)"
                value="${esc(row.imageUrl)}"
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'imageUrl', this.value)"
              >
            </td>
            <td class="mto-source-row">${esc(row.sourceRow || index + 2)}</td>
            <td data-mto-cell="itemId" class="${cellClass('itemId')}">
              <input
                value="${esc(row.itemId)}"
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'itemId', this.value)"
              >
            </td>
            <td data-mto-cell="englishName" class="${cellClass('englishName')}">
              <input
                value="${esc(row.englishName)}"
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'englishName', this.value)"
              >
            </td>
            <td data-mto-cell="chineseName" class="${cellClass('chineseName')}">
              <input
                value="${esc(row.chineseName)}"
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'chineseName', this.value)"
              >
            </td>
            <td data-mto-cell="option" class="${cellClass('option')}">
              <input
                value="${esc(row.option)}"
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'option', this.value)"
              >
            </td>
            <td data-mto-cell="price" class="${cellClass('price')}">
              <input
                type="number"
                min="0"
                step="0.01"
                value="${esc(row.price)}"
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'price', this.value)"
              >
            </td>
            <td data-mto-cell="location" class="${cellClass('location')}">
              <input
                list="mto-location-options"
                value="${esc(row.location)}"
                placeholder="Choose from..."
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'location', this.value)"
              >
            </td>
            <td data-mto-cell="stock" class="${cellClass('stock')}">
              <input
                type="number"
                min="0"
                step="1"
                value="${esc(row.stock)}"
                ${row.saved || mtoBulk.saving ? 'readonly' : ''}
                oninput="updateMtoBulkRow(${index}, 'stock', this.value)"
              >
            </td>
            <td data-mto-status>
              ${mtoBulkRowStatusHtml(row, validation)}
            </td>
          </tr>
        `;
      }).join('');

      empty.hidden = visible.length > 0;
      empty.textContent = mtoBulk.rows.length
        ? 'No loaded rows match this filter.'
        : 'This source sheet has no product rows.';
      refreshMtoBulkSummary();
    }

    function refreshMtoBulkRowValidation() {
      const idCounts = mtoBulkSelectedIdCounts();

      mtoBulk.rows.forEach((row, index) => {
        const rowElement = document.getElementById(`mto-bulk-row-${index}`);

        if (!rowElement) {
          return;
        }

        const validation = validateMtoBulkRow(row, idCounts);

        [
          'itemId',
          'englishName',
          'chineseName',
          'option',
          'price',
          'location',
          'stock',
        ]
          .forEach((field) => {
            const cell = rowElement.querySelector(
              `[data-mto-cell="${field}"]`
            );

            if (cell) {
              cell.classList.toggle(
                'mto-invalid-cell',
                Boolean(validation.errorsByField[field])
              );
            }
          });

        const status = rowElement.querySelector('[data-mto-status]');

        const checkbox = rowElement.querySelector('input[type="checkbox"]');

        if (checkbox) {
          checkbox.disabled = Boolean(
            mtoBulk.saving ||
            row.saved ||
            (isExistingMtoBulkRow(row) && !row.selected)
          );
        }

        if (status) {
          status.innerHTML = mtoBulkRowStatusHtml(row, validation);
        }
      });

      refreshMtoBulkSummary();
    }

    function refreshMtoBulkSummary() {
      const selected = mtoBulk.rows.filter((row) => {
        return row.selected && !row.saved;
      });
      const idCounts = mtoBulkSelectedIdCounts();
      const invalid = selected.filter((row) => {
        return validateMtoBulkRow(row, idCounts).errors.length > 0;
      });
      const warnings = selected.reduce((total, row) => {
        return total + validateMtoBulkRow(row, idCounts).warnings.length;
      }, 0);
      const overLimit = selected.length > mtoBulkMaxRows();
      const view = document.getElementById('mto-bulk-view');

      if (view) {
        view.classList.toggle('saving', mtoBulk.saving);
        view.setAttribute('aria-busy', String(mtoBulk.saving));
      }

      document.getElementById('mto-bulk-selected').textContent =
        `${selected.length} selected`;

      setMtoBulkMessage(
        'mto-bulk-validation',
        overLimit
          ? `Select no more than ${mtoBulkMaxRows()} rows at a time.`
          : (
            invalid.length
              ? `${invalid.length} selected row(s) need changes.`
              : (
                warnings
                  ? `${warnings} image warning(s); copying is still allowed.`
                  : (selected.length ? 'Selected rows are ready.' : '')
              )
          ),
        overLimit || invalid.length ? 'error' : ''
      );

      const saveButton = document.getElementById('mto-bulk-save');
      saveButton.disabled = Boolean(
        mtoBulk.loading ||
        mtoBulk.saving ||
        !selected.length ||
        overLimit ||
        invalid.length
      );
    }

    function updateMtoBulkRow(index, field, value) {
      if (mtoBulk.saving) {
        return;
      }

      const row = mtoBulk.rows[index];

      if (!row || row.saved) {
        return;
      }

      row[field] = value;
      row.serverErrors = [];
      row.dirty = true;
      mtoBulk.dirty = true;
      refreshMtoBulkRowValidation();
    }

    function toggleMtoBulkRow(index, selected) {
      if (mtoBulk.saving) {
        return;
      }

      const row = mtoBulk.rows[index];

      if (!row || row.saved) {
        return;
      }

      row.selected = Boolean(selected);
      refreshMtoBulkRowValidation();
    }

    function filterMtoBulkRows(value) {
      if (mtoBulk.saving) {
        return;
      }

      mtoBulk.filter = value;
      renderMtoBulkRows();
    }

    function selectAllVisibleMtoRows() {
      if (mtoBulk.saving) {
        return;
      }

      mtoBulk.rows.forEach((row, index) => {
        if (
          !row.saved &&
          !isExistingMtoBulkRow(row) &&
          mtoBulkMatchesFilter(row, index)
        ) {
          row.selected = true;
        }
      });
      renderMtoBulkRows();
    }

    function clearMtoBulkSelection() {
      if (mtoBulk.saving) {
        return;
      }

      mtoBulk.rows.forEach((row) => {
        row.selected = false;
      });
      renderMtoBulkRows();
    }

    function applyMtoLocationToSelected() {
      if (mtoBulk.saving) {
        return;
      }

      const input = document.getElementById('mto-bulk-location');
      const location = clientClean(input.value);
      const selected = mtoBulk.rows.filter((row) => {
        return row.selected && !row.saved;
      });

      if (!location || isMtoLocationPlaceholder(location)) {
        alert('Choose 大篋, 細篋, or enter another location first.');
        return;
      }

      if (!selected.length) {
        alert('Select at least one row first.');
        return;
      }

      selected.forEach((row) => {
        row.location = location;
        row.serverErrors = [];
        row.dirty = true;
      });
      mtoBulk.locations = uniqueMtoValues([
        ...mtoBulk.locations,
        location,
      ]);
      mtoBulk.dirty = true;
      renderMtoBulkLocations();
      renderMtoBulkRows();
    }

    function applyMtoBulkSaveErrors(result) {
      const errors = result && (result.rowErrors || result.errors);

      if (!errors) {
        return;
      }

      const entries = Array.isArray(errors)
        ? errors
        : Object.keys(errors).map((key) => ({
          key,
          message: errors[key],
        }));

      entries.forEach((entry) => {
        if (typeof entry === 'string') {
          return;
        }

        const sourceRow = Number(entry.sourceRow || entry.row || entry.key);
        const itemId = normalizeMtoItemId(
          entry.itemId || entry.mtoItemId || entry.key
        );
        const row = mtoBulk.rows.find((candidate) => {
          return (
            (sourceRow && candidate.sourceRow === sourceRow) ||
            (itemId && normalizeMtoItemId(candidate.itemId) === itemId)
          );
        });

        if (row) {
          const message = clientClean(
            entry.message || entry.error || entry.reason
          );
          const normalizedMessage = message || 'Save was blocked.';

          if (!row.serverErrors.includes(normalizedMessage)) {
            row.serverErrors.push(normalizedMessage);
          }
        }
      });
    }

    async function saveMtoBulkSelection() {
      const selected = mtoBulk.rows.filter((row) => {
        return row.selected && !row.saved;
      });
      const idCounts = mtoBulkSelectedIdCounts();
      const invalid = selected.filter((row) => {
        return validateMtoBulkRow(row, idCounts).errors.length > 0;
      });

      if (!selected.length) {
        alert('Select at least one source row.');
        return;
      }

      if (selected.length > mtoBulkMaxRows()) {
        alert(`Select no more than ${mtoBulkMaxRows()} rows at a time.`);
        return;
      }

      if (invalid.length) {
        alert('Complete the highlighted fields and resolve duplicate IDs.');
        refreshMtoBulkRowValidation();
        return;
      }

      const missingImageCount = selected.filter((row) => {
        return !firstMtoBulkImage(row.imageUrl);
      }).length;
      const warning = missingImageCount
        ? `\n\n${missingImageCount} selected row(s) have no image URL.`
        : '';

      if (!confirm(
        `Copy ${selected.length} new item(s) to MTO 32 Summary?` +
        `\n\nMTO Item Left will start at Stock and MTO Item Sold at 0.` +
        warning
      )) {
        return;
      }

      const payloadRows = selected.map((row) => ({
        sourceSheetName: row.sourceSheetName || mtoBulk.sourceSheetName,
        sourceSheetId: row.sourceSheetId || mtoBulk.sourceSheetId,
        sourceRow: row.sourceRow,
        sourceFingerprint: row.sourceFingerprint,
        itemId: clientClean(row.itemId),
        englishName: clientClean(row.englishName),
        chineseName: clientClean(row.chineseName),
        option: clientClean(row.option),
        price: Number(row.price),
        location: clientClean(row.location),
        stock: Number(row.stock),
        imageUrl: mtoBulkImageText(row.imageUrl),
      }));

      mtoBulk.saving = true;
      setMtoBulkMessage(
        'mto-bulk-save-status',
        'Copying selected products…'
      );
      renderMtoBulkRows();

      try {
        const result = await call('saveMtoBulkRows', {
          sourceSheetName: mtoBulk.sourceSheetName,
          sourceSheetId: mtoBulk.sourceSheetId,
          rows: payloadRows,
        });

        if (result && result.ok === false) {
          applyMtoBulkSaveErrors(result);
          renderMtoBulkRows();
          setMtoBulkMessage(
            'mto-bulk-save-status',
            result.message || 'Some rows could not be copied.',
            'error'
          );
          return;
        }

        if (!result || result.ok !== true) {
          throw new Error(
            'The MTO save returned an incomplete response. Reload ' +
            'MTO 32 Summary before trying again; the copy may have completed.'
          );
        }

        const writtenRows = Array.isArray(result.targetRows)
          ? result.targetRows
          : [];
        const expectedIds = payloadRows
          .map((row) => normalizeMtoItemId(row.itemId))
          .sort();
        const writtenIds = writtenRows
          .map((row) => normalizeMtoItemId(row && row.itemId))
          .filter(Boolean)
          .sort();

        if (
          Number(result.createdCount) !== payloadRows.length ||
          writtenRows.length !== payloadRows.length ||
          expectedIds.join('\n') !== writtenIds.join('\n')
        ) {
          throw new Error(
            'Shopify Editor could not verify every copied MTO row. ' +
            'Reload MTO 32 Summary before retrying so duplicate items are ' +
            'not created.'
          );
        }

        selected.forEach((row) => {
          row.saved = true;
          row.selected = false;
          row.dirty = false;
          mtoBulk.existingItemIds.add(normalizeMtoItemId(row.itemId));
        });
        mtoBulk.dirty = mtoBulk.rows.some((row) => row.dirty && !row.saved);

        if (result && (result.locations || result.locationOptions)) {
          mtoBulk.locations = uniqueMtoValues([
            ...mtoBulk.locations,
            ...(result.locations || result.locationOptions),
          ]);
          renderMtoBulkLocations();
        }

        const copiedCount = Number(
          result && (
            result.createdCount ||
            result.copiedCount ||
            result.addedCount ||
            result.writtenCount
          )
        ) || selected.length;

        renderMtoBulkRows();
        setMtoBulkMessage(
          'mto-bulk-save-status',
          `${copiedCount} item(s) copied to MTO 32 Summary.`,
          'success'
        );
      } catch (error) {
        setMtoBulkMessage(
          'mto-bulk-save-status',
          error.message || String(error),
          'error'
        );
      } finally {
        mtoBulk.saving = false;
        renderMtoBulkRows();
      }
    }

    async function openCheckout() {
      // Open a blank tab while this function still runs directly from the
      // user's click. Browsers commonly block window.open after an async
      // google.script.run response.
      const checkoutWindow = window.open(
        'about:blank',
        '_blank'
      );

      setBusy(true, 'Opening checkout…');

      try {
        const appUrl = await call('getCheckoutAppUrl');

        if (checkoutWindow) {
          checkoutWindow.location.replace(appUrl);
          google.script.host.close();
          return;
        }

        // Popup blocking can still occur under strict browser settings. The
        // persistent launcher gives the user a normal clickable link.
        await call('showCheckoutDialog');
        setBusy(false, 'Use the Open Checkout link.');
      } catch (error) {
        if (checkoutWindow && !checkoutWindow.closed) {
          checkoutWindow.close();
        }

        alert(error.message || error);
        setBusy(false);
      }
    }

    async function search() {
      const query = document.getElementById('search').value.trim();

      if (!query) {
        return;
      }

      setBusy(true, 'Searching…');

      try {
        const products = await call('searchShopifyCatalog', query);

        document.getElementById('results').innerHTML =
          products.map((product) => `
            <div
              class="result"
              onclick="openProduct('${product.id}')"
            >
              <b>${esc(product.title)}</b><br>
              <small>
                ${esc(product.handle)} ·
                ${esc(
                  (product.variants || [])
                    .map((variant) => variant.sku)
                    .join(', ')
                )}
              </small>
            </div>
          `).join('') || '<div class="result">No matches</div>';
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    async function openProduct(id) {
      setBusy(true, 'Loading…');

      try {
        const results = await Promise.all([
          call('loadShopifyProduct', id),
          ensureEditorOptions(),
        ]);

        model = results[0];
        errors = {};
        render();
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    async function newProduct() {
      setBusy(true, 'Preparing…');

      try {
        const results = await Promise.all([
          call('blankEditorModel'),
          ensureEditorOptions(),
        ]);

        model = results[0];
        errors = {};
        render();
      } catch (error) {
        alert(error.message || error);
      } finally {

      }

    function mergeOptions(options, selectedValues) {
      const values = [
        ...(options || []),
        ...(Array.isArray(selectedValues)
          ? selectedValues
          : [selectedValues]),
      ].filter(Boolean);

      return values.filter((value, index) => {
        const normalized = String(value).trim().toUpperCase();

        return values.findIndex((candidate) => {
          return String(candidate).trim().toUpperCase() === normalized;
        }) === index;
      });
    }

    const itemTypeCodes = Object.freeze({
      'INK': 'INK',
      'FOUNTAIN PEN INK': 'INK',
      'CALLIGRAPHY INK': 'INK',
      'GLITTER POTION': 'GP',
      'GP': 'GP',
      'FOUNTAIN PEN': 'PEN',
      'DIP PEN': 'PEN',
      'BALLPOINT PEN': 'PEN',
      'ROLLERBALL PEN': 'PEN',
      'GEL PEN': 'PEN',
      'PENCIL': 'PEN',
      'MECHANICAL PENCIL': 'PEN',
      'NOTEBOOK': 'NOTEBOOK',
      'PAPER': 'PAPER',
      'ACCESSORY': 'ACCESSORY',
    });

    function editorFieldFamily() {
      const sheetName = String(
        model && model.targetSheetName || ''
      ).trim();

      if (sheetName === '墨水') {
        return 'INK';
      }

      if (sheetName === '閃粉') {
        return 'GLITTER_POTION';
      }

      if (sheetName === '鋼筆' || sheetName === '原子筆/鉛筆') {
        return 'PEN';
      }

      return 'GENERIC';
    }

    function buildAutomaticItemId(productType, sku) {
      const typeKey = String(productType || '')
        .trim()
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .toUpperCase();

      const fieldFamily = editorFieldFamily();
      const sheetTypeCode = fieldFamily === 'GLITTER_POTION'
        ? 'GP'
        : (
          fieldFamily === 'INK' || fieldFamily === 'PEN'
            ? fieldFamily
            : ''
        );
      const typeCode = sheetTypeCode || itemTypeCodes[typeKey] || typeKey
          .replace(/[^A-Z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');

      const skuCode = String(sku || '')
        .trim()
        .toUpperCase()
        .replace(/\s+/g, '-')
        .replace(/[^A-Z0-9-]+/g, '')
        .replace(/-{2,}/g, '-')
        .replace(/^-+|-+$/g, '');

      return typeCode && skuCode
        ? `${typeCode}-${skuCode}`
        : '';
    }

    function refreshAutomaticItemId() {
      if (!model || model.isNew !== true) {
        return;
      }

      model.itemId = buildAutomaticItemId(
        model.productType,
        model.variants && model.variants[0]
          ? model.variants[0].sku
          : ''
      );

      const itemIdInput = document.querySelector(
        '[data-key="itemId"]'
      );

      if (itemIdInput) {
        itemIdInput.value = model.itemId;
      }
    }

    function field(
      key,
      label,
      value,
      span = 1,
      type = 'text',
      attributes = ''
    ) {
      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          ${
            type === 'textarea'
              ? `
                <textarea data-key="${key}" ${attributes}>${
                  esc(value)
                }</textarea>
              `
              : `
                <input
                  type="${type}"
                  data-key="${key}"
                  value="${esc(value)}"
                  ${attributes}
                >
              `
          }
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function datalistField(
      key,
      label,
      value,
      options,
      span = 1
    ) {
      const listId = `list-${key}`;
      const merged = mergeOptions(options, value);
      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          <input
            data-key="${key}"
            list="${listId}"
            value="${esc(value)}"
          >
          <datalist id="${listId}">
            ${merged.map((option) => `
              <option value="${esc(option)}"></option>
            `).join('')}
          </datalist>
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function selectField(
      key,
      label,
      value,
      options,
      span = 1
    ) {
      const merged = mergeOptions(options, value);
      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          <select data-key="${key}">
            ${merged.map((option) => `
              <option
                value="${esc(option)}"
                ${option === value ? 'selected' : ''}
              >
                ${esc(option)}
              </option>
            `).join('')}
          </select>
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function multiChoiceField(
      key,
      label,
      selectedValues,
      options,
      span = 1
    ) {
      const selected = Array.isArray(selectedValues)
        ? selectedValues
        : [];

      const merged = mergeOptions(options, selected);
      const selectedKeys = new Set(
        selected.map((value) => String(value).toUpperCase())
      );

      const summary = selected.length
        ? selected.join(', ')
        : 'Choose values';

      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          <details class="multi">
            <summary data-list-summary="${key}">${esc(summary)}</summary>
            <div class="choices">
              ${merged.map((option) => `
                <label class="choice">
                  <input
                    type="checkbox"
                    data-list-key="${key}"
                    value="${esc(option)}"
                    ${
                      selectedKeys.has(String(option).toUpperCase())
                        ? 'checked'
                        : ''
                    }
                  >
                  <span>${esc(option)}</span>
                </label>
              `).join('')}
              <div class="custom-choice">
                <input
                  data-custom-list-key="${key}"
                  placeholder="Add another value, then press Enter"
                >
              </div>
            </div>
          </details>
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function updateMultiSummary(key) {
      const summary = document.querySelector(
        `[data-list-summary="${key}"]`

      const values = Array.isArray(model[key])

    function bindFields() {
      document.querySelectorAll('[data-key]').forEach((element) => {
        const update = () => {
          model[element.dataset.key] = element.value;

          if (element.dataset.key === 'title') {
            model.collection = element.value.includes(' - ')
              ? element.value.split(' - ')[0].trim()
              : element.value;

            const collectionInput = document.querySelector(
              '[data-key="collection"]'
            );

            if (collectionInput) {
              collectionInput.value = model.collection;
            }
          }

          if (element.dataset.key === 'productType') {
            refreshAutomaticItemId();
          }
        };

        element.oninput = update;
        element.onchange = () => {
          update();

          if (
            element.dataset.key === 'targetSheetName' ||
            element.dataset.key === 'productType'
          ) {
            render();
          }
        };
      });

      document.querySelectorAll('[data-list-key]').forEach((element) => {
        element.onchange = () => {
          const key = element.dataset.listKey;

          model[key] = Array.from(
            document.querySelectorAll(
              `[data-list-key="${key}"]:checked`
            )
          ).map((checkbox) => checkbox.value);

          updateMultiSummary(key);
        };
      });

      document
        .querySelectorAll('[data-custom-list-key]')
        .forEach((element) => {
          element.onkeydown = (event) => {
            if (event.key !== 'Enter') {
              return;
            }

            event.preventDefault();

            const key = element.dataset.customListKey;
            const value = element.value.trim();

            if (!value) {
              return;
            }

            model[key] = mergeOptions(model[key] || [], [value]);
            editorOptions[key] = mergeOptions(
              editorOptions[key] || [],
              [value]
            );

            render();
          };
        });

      document.querySelectorAll('[data-v]').forEach((element) => {
        const updateVariant = () => {
          const variant = model.variants[Number(element.dataset.v)];
          const key = element.dataset.vkey;

          if (key === 'optionsText') {
            variant.optionValues = element.value
              .split(';')
              .map((value) => value.split('='))
              .filter((parts) => parts.length === 2)
              .map((parts) => ({
                optionName: parts[0].trim(),
                name: parts[1].trim(),
              }));
          } else if (key === 'writeInventory') {
            variant.writeInventory = element.checked;
          } else {
            variant[key] = element.value;

            if (
              Number(element.dataset.v) === 0 &&
              key === 'sku'
            ) {
              refreshAutomaticItemId();
            }
          }
        };

        element.oninput = updateVariant;
        element.onchange = updateVariant;
      });
    }

    async function resize(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = reject;
        reader.onload = () => {
          const image = new Image();

          image.onerror = reject;
          image.onload = () => {
            const scale = Math.min(
              1,
              2048 / Math.max(image.width, image.height)
            );

            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);

            const context = canvas.getContext('2d');
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(
              image,
              0,
              0,
              canvas.width,
              canvas.height
            );

            resolve(
              canvas
                .toDataURL('image/jpeg', 0.9)
                .split(',')[1]
            );
          };

          image.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    }

    async function uploadFiles(files) {
      if (!model || !files || files.length === 0) {
        return;
      }

      setBusy(true, 'Uploading images…');

      try {
        for (const file of files) {
          const base64 = await resize(file);

          const result = await call('uploadEditorImage', {
            base64,
            brand: model.vendor,
            title: model.title,
            collection: model.collection,
          });

          const pendingIds = new Set(
            (model.driveImages || [])
              .filter((image) => image.pendingUpload === true)
              .map((image) => image.id)
          );

          if (result.image && result.image.id) {
            pendingIds.add(result.image.id);
          }

          const previousById = (model.driveImages || []).reduce(
            (byId, image) => {
              byId[image.id] = image;
              return byId;
            },
            {}
          );
          const returnedIds = new Set();
          const mergedReturned = (result.all || []).map((image) => {
            returnedIds.add(image.id);
            const previous = previousById[image.id] || {};

            return Object.assign({}, previous, image, {
              managedFolder:
                previous.managedFolder === true ||
                image.managedFolder === true,
              sourceReferenced:
                previous.sourceReferenced === true ||
                image.sourceReferenced === true,
              sourceRefs:
                previous.sourceRefs || image.sourceRefs || [],
            });
          });
          const unreturnedImages = (model.driveImages || []).filter(
            (image) => !returnedIds.has(image.id)
          );

          model.driveImages = [
            ...mergedReturned,
            ...unreturnedImages,
          ].map((image) => {
            return Object.assign({}, image, {
              pendingUpload: pendingIds.has(image.id),
            });
          });
        }

        delete errors.images;
        render();
      } catch (error) {
        alert(error.message || String(error));
      } finally {
        setBusy(false);

        const fileInput = document.getElementById('files');

        if (fileInput) {
          fileInput.value = '';
        }
      }
    }

    async function removeImage(id) {
      if (!confirm('Move this Drive image to trash?')) {
        return;
      }

      setBusy(true, 'Removing…');

      try {
        await call('removeDriveImage', id);

        model.driveImages = (model.driveImages || []).filter(
          (image) => image.id !== id
        );

        render();
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    function setDriveImageForShopify(id, selected) {
      const image = (model.driveImages || []).find((candidate) => {
        return candidate.id === id;
      });

      if (!image) {
        return;
      }

      image.pendingUpload = selected === true;

      if (image.pendingUpload) {
        delete errors.images;
      }

      render();
    }

    function removeShopifyImage(id) {
      if (
        !model ||
        !confirm(
          'Permanently delete this image from Shopify when you save? ' +
          'This cannot be undone.'
        )
      ) {
        return;
      }

      model.removedShopifyMediaIds = Array.from(new Set([
        ...(model.removedShopifyMediaIds || []),
        id,
      ]));

      model.images = (model.images || []).filter((image) => {
        return image.id !== id;
      });

      delete errors.images;
      render();
    }

    async function save() {
      if (!model) {
        return;
      }

      setBusy(true, 'Saving…');

      try {
        const result = await call('saveCatalogProduct', model);

        if (!result.ok) {
          errors = result.errors || {};
          render();

          document.getElementById('status').textContent =
            'Complete highlighted fields';

          return;
        }

        const resultWarnings = result.warnings || [];
        const imageFailure = resultWarnings.find((warning) => {
          return warning.indexOf('IMAGE_UPLOAD_FAILED:') === 0;
        });
        const imageProcessing = resultWarnings.find((warning) => {
          return warning.indexOf('IMAGE_UPLOAD_PROCESSING:') === 0;
        });

        model = result.product;
        errors = {};

        if (imageFailure) {
          errors.images = imageFailure;
        }

        render();

        if (imageFailure) {
          document.getElementById('status').textContent =
            'Product data saved; image upload failed';
        } else if (imageProcessing) {
          document.getElementById('status').textContent =
            'Product saved; Shopify is processing the image';
        }

        const warningText = resultWarnings.length
          ? `\n\nWarnings:\n${resultWarnings.join('\n')}`
          : '';

        alert(
          `${
            imageFailure
              ? 'Product data saved, but the image upload failed.'
              : 'Saved.'
          } Sheet rows: ${result.written.join(', ')}${warningText}`
        );
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    if (initialMode === 'new') {
      newProduct();
    } else if (initialMode === 'mto-bulk') {
      openMtoBulkEditor();
    }
  </script>
</body>
</html>
