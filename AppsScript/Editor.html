

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --blue: #1769e0;
      --red: #c5221f;
      --line: #dfe3e8;
      --muted: #667085;
      --surface: #f8f9fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #202124;
      font: 13px Arial, sans-serif;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 7px;
      border: 1px solid #c9ced6;
      border-radius: 5px;
      background: #fff;
    }

    input[readonly] {
      color: var(--muted);
      background: #f2f4f7;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      padding: 7px 11px;
      border: 1px solid #bcc3cc;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    button.danger {
      color: var(--red);
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .search {
      width: 380px;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      height: 695px;
    }

    .results {
      overflow: auto;
      border-right: 1px solid var(--line);
    }

    .result {
      padding: 9px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .result:hover {
      background: #f5f8ff;
    }

    .editor {
      overflow: auto;
      padding: 12px;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .span2 {
      grid-column: span 2;
    }

    .span3 {
      grid-column: span 3;
    }

    .span4 {
      grid-column: span 4;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .field.invalid input,
    .field.invalid textarea,
    .field.invalid select,
    .field.invalid details {
      border: 2px solid var(--red);
      background: #fff4f4;
    }

    .error {
      margin-top: 3px;
      color: var(--red);
      font-size: 11px;
    }

    .help {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    h3 {
      margin: 16px 0 7px;
    }

    .multi {
      position: relative;
      border: 1px solid #c9ced6;
      border-radius: 5px;
      background: #fff;
    }

    .multi summary {
      min-height: 33px;
      padding: 8px;
      list-style: none;
      cursor: pointer;
    }

    .multi summary::-webkit-details-marker {
      display: none;
    }

    .multi summary::after {
      float: right;
      content: "▾";
      color: var(--muted);
    }

    .choices {
      position: absolute;
      z-index: 10;
      top: calc(100% + 3px);
      left: -1px;
      width: max(100%, 240px);
      max-height: 240px;
      overflow: auto;
      padding: 7px;
      border: 1px solid #b8c0ca;
      border-radius: 5px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
    }

    .choice {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 4px;
      color: #202124;
      font-size: 12px;
    }

    .choice input {
      width: auto;
      margin: 0;
    }

    .custom-choice {
      margin-top: 6px;
      border-top: 1px solid var(--line);
      padding-top: 7px;
    }

    .variant {
      display: grid;
      grid-template-columns:
        minmax(105px, 1.15fr)
        minmax(72px, 0.65fr)
        minmax(78px, 0.65fr)
        minmax(82px, 0.65fr)
        minmax(90px, 0.8fr)
        minmax(120px, 1fr)
        112px
        34px;
      gap: 6px;
      align-items: end;
      margin-bottom: 6px;
      padding: 8px;
      border-radius: 6px;
      background: var(--surface);
    }

    .checkbox-field {
      align-self: center;
      padding-top: 15px;
    }

    .checkbox-label {
      display: flex;
      gap: 6px;
      align-items: center;
      color: #202124;
      font-size: 11px;
    }

    .checkbox-label input {
      width: auto;
      margin: 0;
    }

    .drop {
      padding: 15px;
      border: 2px dashed #b7c2d0;
      border-radius: 7px;
      text-align: center;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .image {
      min-width: 0;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .image img {
      width: 100%;
      height: 124px;
      object-fit: contain;
      background: #f4f4f4;
    }

    .image small {
      display: block;
      overflow: hidden;
      margin: 4px 0;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .image button {
      width: 100%;
      padding: 5px;
    }

    .image-removal-notice {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid #f1c36d;
      border-radius: 5px;
      color: #714b00;
      background: #fff8e8;
    }

    .busy {
      pointer-events: none;
      opacity: 0.55;
    }

    .status {
      margin-left: auto;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="top">
    <input
      id="search"
      class="search"
      placeholder="Search title, handle, or exact SKU"
    >
    <button onclick="search()">Search</button>
    <button onclick="newProduct()">New product</button>
    <button onclick="openCheckout()">Checkout</button>
    <button class="primary" onclick="save()">Save to Shopify + Sheet</button>
    <span id="status" class="status"></span>
  </div>

  <div class="layout">
    <div id="results" class="results"></div>
    <div id="editor" class="editor">
      <div class="empty">Search for a product or create a new one.</div>
    </div>
  </div>

  <script>
    const initialMode = '<?= mode ?>';
    let model = null;
    let errors = {};
    let editorOptions = null;

    const esc = (value) => String(value ?? '').replace(
      /[&<>"']/g,
      (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[character])
    );

    function call(name, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[name](...args);
      });
    }

    function setBusy(on, text = '') {
      document.body.classList.toggle('busy', on);
      document.getElementById('status').textContent = text;
    }

    async function ensureEditorOptions() {
      if (!editorOptions) {
        editorOptions = await call('getEditorOptions');
      }

      return editorOptions;
    }

    async function openCheckout() {
      // Open a blank tab while this function still runs directly from the
      // user's click. Browsers commonly block window.open after an async
      // google.script.run response.
      const checkoutWindow = window.open(
        'about:blank',
        '_blank'
      );

      setBusy(true, 'Opening checkout…');

      try {
        const appUrl = await call('getCheckoutAppUrl');

        if (checkoutWindow) {
          checkoutWindow.location.replace(appUrl);
          google.script.host.close();
          return;
        }

        // Popup blocking can still occur under strict browser settings. The
        // persistent launcher gives the user a normal clickable link.
        await call('showCheckoutDialog');
        setBusy(false, 'Use the Open Checkout link.');
      } catch (error) {
        if (checkoutWindow && !checkoutWindow.closed) {
          checkoutWindow.close();
        }

        alert(error.message || error);
        setBusy(false);
      }
    }

    async function search() {
      const query = document.getElementById('search').value.trim();

      if (!query) {
        return;
      }

      setBusy(true, 'Searching…');

      try {
        const products = await call('searchShopifyCatalog', query);

        document.getElementById('results').innerHTML =
          products.map((product) => `
            <div
              class="result"
              onclick="openProduct('${product.id}')"
            >
              <b>${esc(product.title)}</b><br>
              <small>
                ${esc(product.handle)} ·
                ${esc(
                  (product.variants || [])
                    .map((variant) => variant.sku)
                    .join(', ')
                )}
              </small>
            </div>
          `).join('') || '<div class="result">No matches</div>';
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    async function openProduct(id) {
      setBusy(true, 'Loading…');

      try {
        const results = await Promise.all([
          call('loadShopifyProduct', id),
          ensureEditorOptions(),
        ]);

        model = results[0];
        errors = {};
        render();
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    async function newProduct() {
      setBusy(true, 'Preparing…');

      try {
        const results = await Promise.all([
          call('blankEditorModel'),
          ensureEditorOptions(),
        ]);

        model = results[0];
        errors = {};
        render();
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    function mergeOptions(options, selectedValues) {
      const values = [
        ...(options || []),
        ...(Array.isArray(selectedValues)
          ? selectedValues
          : [selectedValues]),
      ].filter(Boolean);

      return values.filter((value, index) => {
        const normalized = String(value).trim().toUpperCase();

        return values.findIndex((candidate) => {
          return String(candidate).trim().toUpperCase() === normalized;
        }) === index;
      });
    }

    const itemTypeCodes = Object.freeze({
      'INK': 'INK',
      'FOUNTAIN PEN INK': 'INK',
      'GLITTER POTION': 'INK',
      'FOUNTAIN PEN': 'PEN',
      'DIP PEN': 'PEN',
      'NOTEBOOK': 'NOTEBOOK',
      'PAPER': 'PAPER',
      'ACCESSORY': 'ACCESSORY',
    });

    function buildAutomaticItemId(productType, sku) {
      const typeKey = String(productType || '')
        .trim()
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .toUpperCase();

      const typeCode = itemTypeCodes[typeKey] || typeKey
        .replace(/[^A-Z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');

      const skuCode = String(sku || '')
        .trim()
        .toUpperCase()
        .replace(/\s+/g, '-')
        .replace(/[^A-Z0-9-]+/g, '')
        .replace(/-{2,}/g, '-')
        .replace(/^-+|-+$/g, '');

      return typeCode && skuCode
        ? `${typeCode}-${skuCode}`
        : '';
    }

    function refreshAutomaticItemId() {
      if (!model || model.isNew !== true) {
        return;
      }

      model.itemId = buildAutomaticItemId(
        model.productType,
        model.variants && model.variants[0]
          ? model.variants[0].sku
          : ''
      );

      const itemIdInput = document.querySelector(
        '[data-key="itemId"]'
      );

      if (itemIdInput) {
        itemIdInput.value = model.itemId;
      }
    }

    function field(
      key,
      label,
      value,
      span = 1,
      type = 'text',
      attributes = ''
    ) {
      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          ${
            type === 'textarea'
              ? `
                <textarea data-key="${key}" ${attributes}>${
                  esc(value)
                }</textarea>
              `
              : `
                <input
                  type="${type}"
                  data-key="${key}"
                  value="${esc(value)}"
                  ${attributes}
                >
              `
          }
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function datalistField(
      key,
      label,
      value,
      options,
      span = 1
    ) {
      const listId = `list-${key}`;
      const merged = mergeOptions(options, value);
      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          <input
            data-key="${key}"
            list="${listId}"
            value="${esc(value)}"
          >
          <datalist id="${listId}">
            ${merged.map((option) => `
              <option value="${esc(option)}"></option>
            `).join('')}
          </datalist>
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function selectField(
      key,
      label,
      value,
      options,
      span = 1
    ) {
      const merged = mergeOptions(options, value);
      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          <select data-key="${key}">
            ${merged.map((option) => `
              <option
                value="${esc(option)}"
                ${option === value ? 'selected' : ''}
              >
                ${esc(option)}
              </option>
            `).join('')}
          </select>
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function multiChoiceField(
      key,
      label,
      selectedValues,
      options,
      span = 1
    ) {
      const selected = Array.isArray(selectedValues)
        ? selectedValues
        : [];

      const merged = mergeOptions(options, selected);
      const selectedKeys = new Set(
        selected.map((value) => String(value).toUpperCase())
      );

      const summary = selected.length
        ? selected.join(', ')
        : 'Choose values';

      const error = errors[key];

      return `
        <div class="field span${span} ${error ? 'invalid' : ''}">
          <label>${esc(label)}</label>
          <details class="multi">
            <summary data-list-summary="${key}">${esc(summary)}</summary>
            <div class="choices">
              ${merged.map((option) => `
                <label class="choice">
                  <input
                    type="checkbox"
                    data-list-key="${key}"
                    value="${esc(option)}"
                    ${
                      selectedKeys.has(String(option).toUpperCase())
                        ? 'checked'
                        : ''
                    }
                  >
                  <span>${esc(option)}</span>
                </label>
              `).join('')}
              <div class="custom-choice">
                <input
                  data-custom-list-key="${key}"
                  placeholder="Add another value, then press Enter"
                >
              </div>
            </div>
          </details>
          ${error ? `<div class="error">${esc(error)}</div>` : ''}
        </div>
      `;
    }

    function render() {
      if (!model || !editorOptions) {
        return;
      }

      model.collection = (model.title || '').includes(' - ')
        ? model.title.split(' - ')[0].trim()
        : (model.title || '');

      if (model.isNew === true) {
        model.itemId = buildAutomaticItemId(
          model.productType,
          model.variants && model.variants[0]
            ? model.variants[0].sku
            : ''
        );
      }

      document.getElementById('editor').innerHTML = `
        <div class="grid">
          ${field(
            'itemId',
            'Item ID *',
            model.itemId || '',
            1,
            'text',
            model.isNew === true ? 'readonly' : ''
          )}
          ${field('title', 'English Name *', model.title || '', 2)}
          ${selectField(
            'status',
            'Status *',
            model.status || 'DRAFT',
            editorOptions.statuses,
            1
          )}

          ${field(
            'chineseName',
            'Chinese Name',
            model.chineseName || '',
            2
          )}
          ${field('handle', 'Handle *', model.handle || '', 2)}

          ${datalistField(
            'vendor',
            'Brand *',
            model.vendor || '',
            editorOptions.brands,
            1
          )}
          ${field(
            'collection',
            'Drive Collection',
            model.collection || '',
            2,
            'text',
            'readonly'
          )}
          ${datalistField(
            'productType',
            'Product Type *',
            model.productType || '',
            editorOptions.productTypes,
            1
          )}

          ${datalistField(
            'storageLocation',
            'Storage Location',
            model.storageLocation || '',
            editorOptions.storageLocations,
            1
          )}
          ${datalistField(
            'inkSize',
            'Ink Size',
            model.inkSize || '',
            editorOptions.inkSizes,
            1
          )}
          ${datalistField(
            'targetSheetName',
            'Sheet',
            model.targetSheetName || '',
            editorOptions.sheetNames,
            2
          )}

          ${multiChoiceField(
            'tags',
            'Tags',
            Array.isArray(model.tags) ? model.tags : [],
            editorOptions.tags,
            4
          )}

          ${multiChoiceField(
            'baseColors',
            'Ink Base Color',
            model.baseColors || [],
            editorOptions.baseColors,
            2
          )}
          ${multiChoiceField(
            'glitterColors',
            'Ink Glitter Color',
            model.glitterColors || [],
            editorOptions.glitterColors,
            1
          )}
          ${multiChoiceField(
            'sheenColors',
            'Ink Sheen Color',
            model.sheenColors || [],
            editorOptions.sheenColors,
            1
          )}

          ${field(
            'descriptionHtml',
            'Description HTML',
            model.descriptionHtml || '',
            4,
            'textarea'
          )}
        </div>

        <h3>Variants</h3>
        <div id="variants">
          ${(model.variants || []).map(variantHtml).join('')}
        </div>

        <button onclick="addVariant()">+ Add variant</button>
        ${
          errors.variants
            ? `<div class="error">${esc(errors.variants)}</div>`
            : ''
        }

        <h3>Images *</h3>
        <div class="drop ${errors.images ? 'field invalid' : ''}">
          <input
            id="files"
            type="file"
            accept="image/*"
            multiple
            onchange="uploadFiles(this.files)"
          >
          <div>
            Images are resized to a maximum 2048 px edge and saved as JPEG.
          </div>
          ${
            errors.images
              ? `<div class="error">${esc(errors.images)}</div>`
              : ''
          }
        </div>

        <div class="images">
          ${
            [
              ...(model.driveImages || []),
              ...(model.images || []),
            ].map(imageHtml).join('')
          }
        </div>

        ${
          (model.removedShopifyMediaIds || []).length
            ? `
              <div class="image-removal-notice">
                ${model.removedShopifyMediaIds.length} Shopify image(s)
                will be permanently deleted when you save.
              </div>
            `
            : ''
        }

        <h3>Sheet links</h3>
        <div>
          ${
            (model.sourceRows || [])
              .map((row) => `${esc(row.sheetName)} row ${row.row}`)
              .join('<br>') ||
            'No matching source row; saving will append one.'
          }
        </div>
      `;

      bindFields();
    }

    function variantHtml(variant, index) {
      const inventoryError = errors[`variant_${index}_inventory`];

      return `
        <div class="variant">
          <div class="field ${
            errors[`variant_${index}_sku`] ? 'invalid' : ''
          }">
            <label>SKU *</label>
            <input
              data-v="${index}"
              data-vkey="sku"
              value="${esc(variant.sku || '')}"
            >
            ${
              errors[`variant_${index}_sku`]
                ? `
                  <div class="error">${
                    esc(errors[`variant_${index}_sku`])
                  }</div>
                `
                : ''
            }
          </div>

          <div class="field ${
            errors[`variant_${index}_price`] ? 'invalid' : ''
          }">
            <label>Price *</label>
            <input
              type="number"
              min="0.01"
              step="0.01"
              data-v="${index}"
              data-vkey="price"
              value="${esc(variant.price || '')}"
            >
          </div>

          <div class="field ${inventoryError ? 'invalid' : ''}">
            <label>Inventory *</label>
            <input
              type="number"
              min="0"
              step="1"
              data-v="${index}"
              data-vkey="inventory"
              value="${esc(
                variant.inventory == null
                  ? ''
                  : variant.inventory
              )}"
            >
            ${
              inventoryError
                ? `<div class="error">${esc(inventoryError)}</div>`
                : ''
            }
          </div>

          <div>
            <label>Compare at</label>
            <input
              type="number"
              min="0"
              step="0.01"
              data-v="${index}"
              data-vkey="compareAtPrice"
              value="${esc(variant.compareAtPrice || '')}"
            >
          </div>

          <div>
            <label>Barcode</label>
            <input
              data-v="${index}"
              data-vkey="barcode"
              value="${esc(variant.barcode || '')}"
            >
          </div>

          <div>
            <label>Options (Name=Value)</label>
            <input
              data-v="${index}"
              data-vkey="optionsText"
              value="${esc(
                (variant.optionValues || [])
                  .map((option) => {
                    return `${option.optionName}=${option.name}`;
                  })
                  .join('; ')
              )}"
            >
          </div>

          <div class="checkbox-field">
            <label class="checkbox-label">
              <input
                type="checkbox"
                data-v="${index}"
                data-vkey="writeInventory"
                ${variant.writeInventory === true ? 'checked' : ''}
              >
              Update stock
            </label>
            <div class="help">
              Automatic for new variants; optional when editing.
            </div>
          </div>

          <button
            class="danger"
            title="Remove variant"
            onclick="removeVariant(${index})"
          >
            ×
          </button>
        </div>
      `;
    }

    function imageHtml(image) {
      return `
        <div class="image">
          <img
            src="${esc(image.downloadUrl || image.url)}"
            alt="${esc(image.alt || image.name || '')}"
          >
          <small>${esc(
            image.name ||
            image.alt ||
            'Shopify image'
          )}</small>
          ${
            image.source === 'DRIVE'
              ? `
                <button
                  class="danger"
                  onclick="removeImage('${image.id}')"
                >
                  Remove Drive file
                </button>
              `
              : `
                <small>Shopify media</small>
                <button
                  class="danger"
                  onclick="removeShopifyImage('${esc(image.id)}')"
                >
                  Remove from Shopify
                </button>
              `
          }
        </div>
      `;
    }

    function updateMultiSummary(key) {
      const summary = document.querySelector(
        `[data-list-summary="${key}"]`
      );

      if (!summary) {
        return;
      }

      const values = Array.isArray(model[key])
        ? model[key]
        : [];

      summary.textContent = values.length
        ? values.join(', ')
        : 'Choose values';
    }

    function bindFields() {
      document.querySelectorAll('[data-key]').forEach((element) => {
        const update = () => {
          model[element.dataset.key] = element.value;

          if (element.dataset.key === 'title') {
            model.collection = element.value.includes(' - ')
              ? element.value.split(' - ')[0].trim()
              : element.value;

            const collectionInput = document.querySelector(
              '[data-key="collection"]'
            );

            if (collectionInput) {
              collectionInput.value = model.collection;
            }
          }

          if (element.dataset.key === 'productType') {
            refreshAutomaticItemId();
          }
        };

        element.oninput = update;
        element.onchange = update;
      });

      document.querySelectorAll('[data-list-key]').forEach((element) => {
        element.onchange = () => {
          const key = element.dataset.listKey;

          model[key] = Array.from(
            document.querySelectorAll(
              `[data-list-key="${key}"]:checked`
            )
          ).map((checkbox) => checkbox.value);

          updateMultiSummary(key);
        };
      });

      document
        .querySelectorAll('[data-custom-list-key]')
        .forEach((element) => {
          element.onkeydown = (event) => {
            if (event.key !== 'Enter') {
              return;
            }

            event.preventDefault();

            const key = element.dataset.customListKey;
            const value = element.value.trim();

            if (!value) {
              return;
            }

            model[key] = mergeOptions(model[key] || [], [value]);
            editorOptions[key] = mergeOptions(
              editorOptions[key] || [],
              [value]
            );

            render();
          };
        });

      document.querySelectorAll('[data-v]').forEach((element) => {
        const updateVariant = () => {
          const variant = model.variants[Number(element.dataset.v)];
          const key = element.dataset.vkey;

          if (key === 'optionsText') {
            variant.optionValues = element.value
              .split(';')
              .map((value) => value.split('='))
              .filter((parts) => parts.length === 2)
              .map((parts) => ({
                optionName: parts[0].trim(),
                name: parts[1].trim(),
              }));
          } else if (key === 'writeInventory') {
            variant.writeInventory = element.checked;
          } else {
            variant[key] = element.value;

            if (
              Number(element.dataset.v) === 0 &&
              key === 'sku'
            ) {
              refreshAutomaticItemId();
            }
          }
        };

        element.oninput = updateVariant;
        element.onchange = updateVariant;
      });
    }

    function addVariant() {
      model.variants.push({
        id: '',
        title: '',
        sku: '',
        price: '',
        compareAtPrice: '',
        barcode: '',
        inventory: '',
        inventoryItemId: '',
        tracked: true,
        writeInventory: true,
        optionValues: [],
      });

      render();
    }

    function removeVariant(index) {
      model.variants.splice(index, 1);
      render();
    }

    async function resize(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = reject;
        reader.onload = () => {
          const image = new Image();

          image.onerror = reject;
          image.onload = () => {
            const scale = Math.min(
              1,
              2048 / Math.max(image.width, image.height)
            );

            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);

            const context = canvas.getContext('2d');
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(
              image,
              0,
              0,
              canvas.width,
              canvas.height
            );

            resolve(
              canvas
                .toDataURL('image/jpeg', 0.9)
                .split(',')[1]
            );
          };

          image.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    }

    async function uploadFiles(files) {
      if (!model || !files || files.length === 0) {
        return;
      }

      setBusy(true, 'Uploading images…');

      try {
        for (const file of files) {
          const base64 = await resize(file);

          const result = await call('uploadEditorImage', {
            base64,
            brand: model.vendor,
            title: model.title,
            collection: model.collection,
          });

          const pendingIds = new Set(
            (model.driveImages || [])
              .filter((image) => image.pendingUpload === true)
              .map((image) => image.id)
          );

          if (result.image && result.image.id) {
            pendingIds.add(result.image.id);
          }

          model.driveImages = (result.all || []).map((image) => {
            return Object.assign({}, image, {
              pendingUpload: pendingIds.has(image.id),
            });
          });
        }

        delete errors.images;
        render();
      } catch (error) {
        alert(error.message || String(error));
      } finally {
        setBusy(false);

        const fileInput = document.getElementById('files');

        if (fileInput) {
          fileInput.value = '';
        }
      }
    }

    async function removeImage(id) {
      if (!confirm('Move this Drive image to trash?')) {
        return;
      }

      setBusy(true, 'Removing…');

      try {
        await call('removeDriveImage', id);

        model.driveImages = (model.driveImages || []).filter(
          (image) => image.id !== id
        );

        render();
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    function removeShopifyImage(id) {
      if (
        !model ||
        !confirm(
          'Permanently delete this image from Shopify when you save? ' +
          'This cannot be undone.'
        )
      ) {
        return;
      }

      model.removedShopifyMediaIds = Array.from(new Set([
        ...(model.removedShopifyMediaIds || []),
        id,
      ]));

      model.images = (model.images || []).filter((image) => {
        return image.id !== id;
      });

      delete errors.images;
      render();
    }

    async function save() {
      if (!model) {
        return;
      }

      setBusy(true, 'Saving…');

      try {
        const result = await call('saveCatalogProduct', model);

        if (!result.ok) {
          errors = result.errors || {};
          render();

          document.getElementById('status').textContent =
            'Complete highlighted fields';

          return;
        }

        model = result.product;
        errors = {};
        render();

        const warningText = (result.warnings || []).length
          ? `\n\nWarnings:\n${result.warnings.join('\n')}`
          : '';

        alert(
          `Saved. Sheet rows: ${result.written.join(', ')}${warningText}`
        );
      } catch (error) {
        alert(error.message || error);
      } finally {
        setBusy(false);
      }
    }

    if (initialMode === 'new') {
      newProduct();
    }
  </script>
</body>
</html>
